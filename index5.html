<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чат 6А · загрузка</title>
<style>
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050505;color:#fff}
  body{display:grid;place-items:center}
  .card{width:min(390px,calc(100vw - 32px));padding:22px;border-radius:22px;background:#111;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 70px rgba(0,0,0,.45);text-align:center}
  .spin{width:28px;height:28px;margin:0 auto 12px;border:3px solid rgba(255,255,255,.18);border-top-color:#60a5fa;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  .muted{color:#aaa;font-size:.9rem;line-height:1.45}
  .err{color:#ff7b7b;font-size:.86rem;margin-top:10px;white-space:pre-wrap;text-align:left}
</style>
</head>
<body>
<div class="card" id="restoreCard"><div class="spin"></div><b>Загрузка чата…</b><div class="muted">Загружаю проверенную полную страницу.</div></div>
<script>
(async function(){
  window.CHAT6A_APP_VERSION = 'package1-stable-loader-2026-05-22';
  var stableSources = [
    'https://raw.githubusercontent.com/sqeezy-53/6aclass/7b76e25f9dc6529e327edc81ccb9bfadff5f3ca9/index5.html',
    'https://cdn.jsdelivr.net/gh/sqeezy-53/6aclass@7b76e25f9dc6529e327edc81ccb9bfadff5f3ca9/index5.html'
  ];
  var lastError = null;

  function injectOnce(html, needle, insertion) {
    if (html.indexOf(insertion) !== -1) return html;
    if (html.indexOf(needle) === -1) throw new Error('Не найден обязательный script marker: ' + needle);
    return html.replace(needle, needle + '\n' + insertion);
  }

  function validateFullHtml(html) {
    var required = [
      'id="appRoot"',
      'id="authGate"',
      'id="chatMessages"',
      'id="chatInput"',
      'id="btnMicMain"',
      'assets/js/chat/theme-bootstrap.js',
      'assets/js/chat/config.js',
      'assets/js/chat/e2e-security-refactor.js',
      'assets/js/chat/app.js'
    ];
    for (var i = 0; i < required.length; i++) {
      if (html.indexOf(required[i]) === -1) throw new Error('Источник вернул неполный HTML: нет ' + required[i]);
    }
  }

  for (var i = 0; i < stableSources.length; i++) {
    try {
      var resp = await fetch(stableSources[i], { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' from ' + stableSources[i]);
      var html = await resp.text();
      validateFullHtml(html);

      html = injectOnce(
        html,
        '<script src="assets/js/chat/theme-bootstrap.js"><\/script>',
        '<script src="assets/js/chat/app-version.js"><\/script>'
      );
      html = injectOnce(
        html,
        '<script src="assets/js/chat/e2e-security-refactor.js"><\/script>',
        '<script src="assets/js/chat/e2e-device-local.js"><\/script>\n<script src="assets/js/chat/e2e-media-compat.js"><\/script>'
      );

      console.log('[chat6a] restored full index5 from stable source', stableSources[i]);
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (e) {
      lastError = e;
      console.warn('[index5 stable loader] source failed', stableSources[i], e);
    }
  }

  document.getElementById('restoreCard').innerHTML = '<b>Не удалось загрузить чат</b><div class="muted">Нажми Ctrl+Shift+R. Если не помогло — очисти кэш сайта или временно отключи блокировщики.</div><div class="err"></div>';
  document.querySelector('.err').textContent = String(lastError && (lastError.message || lastError) || 'unknown error');
})();
</script>
</body>
</html>
