<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Чат 6А · 6aclass.online</title>
    <meta name="description" content="Чат класса 6А — общайся, делись, будь в курсе!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Применяем тему до рендера -->
    <script>
        (function () {
            var t = localStorage.getItem('index6a_theme');
            document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        })();
    </script>

    <style>
        /* ═══════════════════════════════════════
           ТОКЕНЫ
        ═══════════════════════════════════════ */
        :root {
            --font-display: 'Outfit', system-ui, sans-serif;
            --font-body: 'DM Sans', system-ui, sans-serif;
            --radius-xs: 8px;
            --radius-sm: 12px;
            --radius: 18px;
            --radius-lg: 24px;
            --radius-bubble-me:    20px 20px 5px 20px;
            --radius-bubble-other: 20px 20px 20px 5px;
            --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --scroll-threshold: 120px;
        }

        [data-theme="dark"] {
            --bg-base:          #070910;
            --bg-chat:          #0c0f17;
            --surface:          #131720;
            --surface-2:        #181d27;
            --surface-3:        #1e2433;
            --surface-glass:    rgba(19, 23, 32, 0.75);
            --text:             #eef1f8;
            --muted:            #8a95a9;
            --muted-soft:       #5a6172;
            --border:           rgba(255,255,255,0.07);
            --border-focus:     rgba(94,200,255,0.45);
            --accent:           #5ec8ff;
            --accent-2:         #a78bfa;
            --accent-3:         #34d399;
            --accent-strong:    #3db5f5;
            --accent-dim:       rgba(94,200,255,0.13);
            --accent-text:      #040c14;
            --bubble-me-bg:     linear-gradient(145deg, #1a5fa8 0%, #2875cc 45%, #3d92e8 100%);
            --bubble-me-glow:   rgba(61,146,232,0.22);
            --bubble-me-text:   #ffffff;
            --bubble-other-bg:  #181d27;
            --bubble-other-border: rgba(255,255,255,0.08);
            --bubble-other-text:#e8eaf0;
            --nav-bg:           rgba(7,9,16,0.9);
            --composer-bg:      rgba(13,16,24,0.95);
            --shadow-card:      0 20px 56px rgba(0,0,0,0.45);
            --shadow-bubble:    0 2px 12px rgba(0,0,0,0.22);
            --dot-color:        rgba(255,255,255,0.025);
            --noise: 0.04;
        }

        [data-theme="light"] {
            --bg-base:          #e8ecf4;
            --bg-chat:          #dde3ee;
            --surface:          #ffffff;
            --surface-2:        #f4f7fc;
            --surface-3:        #edf1f8;
            --surface-glass:    rgba(255,255,255,0.82);
            --text:             #0f131c;
            --muted:            #596274;
            --muted-soft:       #9aa3b5;
            --border:           rgba(15,20,32,0.08);
            --border-focus:     rgba(37,99,235,0.45);
            --accent:           #2563eb;
            --accent-2:         #6366f1;
            --accent-3:         #059669;
            --accent-strong:    #1d4ed8;
            --accent-dim:       rgba(37,99,235,0.09);
            --accent-text:      #ffffff;
            --bubble-me-bg:     linear-gradient(145deg, #1d4ed8 0%, #3b82f6 100%);
            --bubble-me-glow:   rgba(59,130,246,0.18);
            --bubble-me-text:   #ffffff;
            --bubble-other-bg:  #ffffff;
            --bubble-other-border: rgba(15,20,32,0.07);
            --bubble-other-text:#14181f;
            --nav-bg:           rgba(255,255,255,0.88);
            --composer-bg:      rgba(255,255,255,0.95);
            --shadow-card:      0 16px 44px rgba(15,20,32,0.08);
            --shadow-bubble:    0 2px 10px rgba(15,20,32,0.07);
            --dot-color:        rgba(15,20,32,0.035);
            --noise: 0.016;
        }

        /* ═══════════════════════════════════════
           СБРОС
        ═══════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: clip; -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-body);
            background: var(--bg-base);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Зернистая текстура */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: var(--noise);
            pointer-events: none;
            z-index: 0;
        }

        .hidden { display: none !important; }

        /* ═══════════════════════════════════════
           АНИМАЦИИ
        ═══════════════════════════════════════ */
        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(14px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes typingBounce {
            0%, 70%, 100% { transform: translateY(0); opacity: 0.3; }
            35%            { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes sheetPop {
            from { opacity: 0; transform: scale(0.9) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes navAurora {
            0%, 100% { background-position: 0% 40%; }
            50%       { background-position: 100% 60%; }
        }

        @keyframes navEdgeShine {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes composerGlow {
            0%, 100% { box-shadow: 0 0 0 1px var(--border), var(--shadow-bubble); }
            50%       { box-shadow: 0 0 0 1px rgba(94,200,255,.2), 0 0 24px rgba(94,200,255,.06), var(--shadow-bubble); }
        }

        @keyframes logoShift {
            0%, 100% { background-position: 0% 50%; }
            50%       { background-position: 100% 50%; }
        }

        @keyframes authCardIn {
            from { opacity: 0; transform: translateY(32px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes btnSendPop {
            0%   { transform: scale(1); }
            40%  { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* ═══════════════════════════════════════
           СТРАНИЦА АВТОРИЗАЦИИ
        ═══════════════════════════════════════ */
        .auth-gate {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            background:
                radial-gradient(ellipse 100% 60% at 50% -10%, var(--accent-dim), transparent 55%),
                var(--bg-base);
            position: relative;
            z-index: 1;
        }

        /* Орб-фон в auth */
        .auth-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.18;
        }
        .auth-orb--1 {
            width: 320px; height: 320px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            top: -80px; left: -60px;
        }
        .auth-orb--2 {
            width: 240px; height: 240px;
            background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
            bottom: -60px; right: -40px;
        }
        [data-theme="light"] .auth-orb { opacity: 0.1; }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 1;
            animation: authCardIn 0.5s cubic-bezier(0.34,1.1,0.64,1) both;
        }

        /* Верхний акцент-блик */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 64px; height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
        }

        .auth-logo {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: -0.04em;
            margin-bottom: 4px;
        }
        .auth-logo span {
            background: linear-gradient(100deg, var(--accent) 0%, var(--accent-2) 50%, var(--accent) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: logoShift 6s ease-in-out infinite;
        }

        .auth-card h2 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -0.025em;
            margin-bottom: 6px;
        }

        .auth-card p.sub {
            font-size: 0.86rem;
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.55;
        }

        .auth-field { margin-bottom: 16px; }

        .auth-field label {
            display: block;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 7px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-family: inherit;
            font-size: 0.97rem;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
            -webkit-appearance: none;
        }
        .auth-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .auth-input-nick {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.02em;
        }

        .auth-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            padding: 13px 18px;
            border-radius: var(--radius-sm);
            border: none;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: filter var(--transition), transform 0.15s ease,
                        background var(--transition), box-shadow var(--transition);
            position: relative;
            overflow: hidden;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
        .btn:active:not(:disabled) { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-strong), var(--accent));
            color: var(--accent-text);
            box-shadow: 0 4px 18px var(--bubble-me-glow);
        }
        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.08);
            box-shadow: 0 6px 24px var(--bubble-me-glow);
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--accent);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover:not(:disabled) {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .spinner-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 16px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .auth-error {
            font-size: 0.82rem;
            color: #f87171;
            margin-top: 12px;
            min-height: 1.2em;
            line-height: 1.4;
        }

        .visually-hidden {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }

        /* ═══════════════════════════════════════
           ХЕДЕР ЧАТА
        ═══════════════════════════════════════ */
        .chat-top {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding:
                max(12px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                12px
                max(16px, env(safe-area-inset-left));
            background: var(--nav-bg);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            flex-shrink: 0;
            z-index: 50;
            overflow: hidden;
            isolation: isolate;
        }

        /* Aurora-фон хедера */
        .chat-top::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 120% 180% at 15% -20%, rgba(94,200,255,.18) 0%, transparent 45%),
                radial-gradient(ellipse 100% 160% at 85% 120%, rgba(139,92,246,.14) 0%, transparent 42%),
                linear-gradient(105deg, rgba(94,200,255,.05) 0%, rgba(139,92,246,.06) 35%, rgba(94,200,255,.05) 100%);
            background-size: 100% 100%, 100% 100%, 280% 280%;
            animation: navAurora 22s ease-in-out infinite;
            pointer-events: none;
        }
        [data-theme="light"] .chat-top::before {
            background:
                radial-gradient(ellipse 120% 180% at 10% -30%, rgba(37,99,235,.1) 0%, transparent 48%),
                radial-gradient(ellipse 100% 160% at 90% 130%, rgba(99,102,241,.08) 0%, transparent 45%);
        }

        /* Нижняя светящаяся линия */
        .chat-top-edge {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(94,200,255,.4) 18%,
                rgba(167,139,250,.5) 50%,
                rgba(94,200,255,.4) 82%,
                transparent 100%);
            background-size: 200% 100%;
            animation: navEdgeShine 8s linear infinite;
        }
        [data-theme="light"] .chat-top-edge {
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(37,99,235,.3) 22%,
                rgba(99,102,241,.35) 50%,
                rgba(37,99,235,.3) 78%,
                transparent 100%);
            background-size: 200% 100%;
        }

        .chat-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            color: var(--muted);
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: color var(--transition), background var(--transition),
                        border-color var(--transition), transform 0.15s ease;
            flex-shrink: 0;
        }
        .back-link:hover {
            color: var(--text);
            background: var(--accent-dim);
            border-color: var(--border);
            transform: translateX(-2px);
        }

        .chat-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.08rem;
            letter-spacing: -0.025em;
            flex: 1;
            min-width: 0;
        }
        .chat-title span {
            background: linear-gradient(100deg, var(--accent) 0%, var(--accent-2) 50%, var(--accent) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: logoShift 8s ease-in-out infinite;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color var(--transition), background var(--transition),
                        border-color var(--transition), transform 0.15s ease,
                        box-shadow 0.3s ease;
        }
        .icon-btn svg { width: 19px; height: 19px; }
        .icon-btn:hover {
            color: var(--text);
            background: var(--accent-dim);
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .icon-btn:active { transform: scale(0.95); }

        /* Переключатель темы — track стиль */
        .theme-toggle {
            position: relative;
            width: 52px;
            height: 28px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color var(--transition), background var(--transition),
                        box-shadow 0.3s ease, transform 0.15s ease;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            box-shadow: 0 0 16px rgba(94,200,255,.14);
            transform: scale(1.05);
        }
        .theme-toggle .icon-sun, .theme-toggle .icon-moon {
            width: 16px; height: 16px;
            position: absolute;
            transition: opacity 0.28s ease, transform 0.4s cubic-bezier(.34,1.56,.64,1);
        }
        [data-theme="dark"]  .icon-sun  { opacity: 1; transform: scale(1); color: var(--accent); }
        [data-theme="dark"]  .icon-moon { opacity: 0; transform: scale(0.4) rotate(90deg); }
        [data-theme="light"] .icon-sun  { opacity: 0; transform: scale(0.4) rotate(-90deg); }
        [data-theme="light"] .icon-moon { opacity: 1; transform: scale(1); color: var(--accent); }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            min-height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--muted);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition), color var(--transition),
                        border-color var(--transition), transform 0.15s ease;
            white-space: nowrap;
        }
        .btn-logout svg { width: 16px; height: 16px; flex-shrink: 0; }
        .btn-logout:hover {
            color: #f87171;
            background: rgba(248,113,113,.1);
            border-color: rgba(248,113,113,.3);
            transform: scale(1.02);
        }

        /* Строка поиска */
        .chat-search-row {
            position: relative;
            z-index: 1;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px; height: 16px;
            color: var(--muted-soft);
            pointer-events: none;
        }

        .header-search {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-family: inherit;
            font-size: 0.86rem;
            transition: border-color var(--transition), box-shadow var(--transition),
                        background var(--transition);
        }
        .header-search:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .header-search::placeholder { color: var(--muted-soft); }

        .search-hint {
            font-size: 0.71rem;
            color: var(--muted-soft);
            min-height: 1.2em;
            margin-top: 5px;
            padding-left: 12px;
        }

        /* ═══════════════════════════════════════
           ТЕЛО ЧАТА
        ═══════════════════════════════════════ */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            padding: 0 max(10px, env(safe-area-inset-left)) 0 max(10px, env(safe-area-inset-right));
            position: relative;
            z-index: 1;
        }

        .chat-scroll-area {
            flex: 1;
            position: relative;
            min-height: 0;
            display: flex;
            flex-direction: column;
            border-radius: 0;
            background-color: var(--bg-chat);
            /* Точечный паттерн фона */
            background-image:
                radial-gradient(var(--dot-color) 1px, transparent 1px),
                radial-gradient(ellipse 80% 50% at 50% 100%, rgba(94,200,255,.04), transparent 55%);
            background-size: 22px 22px, auto;
            overflow: hidden;
        }
        [data-theme="light"] .chat-scroll-area {
            background-image:
                radial-gradient(var(--dot-color) 1px, transparent 1px),
                radial-gradient(ellipse 80% 50% at 50% 100%, rgba(37,99,235,.03), transparent 55%);
            background-size: 22px 22px, auto;
        }

        /* Typing-индикатор */
        .typing-bar {
            flex-shrink: 0;
            min-height: 34px;
            padding: 6px 18px 4px;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            margin-left: 6px;
        }
        .typing-dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: typingBounce 1.3s ease-in-out infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.36s; }

        .global-status {
            font-size: 0.74rem;
            color: var(--muted);
            padding: 3px 18px;
            min-height: 1.1em;
        }
        .global-status.is-error { color: #f87171; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 14px 24px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            scroll-behavior: smooth;
        }

        /* Кастомный скроллбар */
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--muted-soft);
        }

        .chat-empty {
            margin: auto;
            text-align: center;
            color: var(--muted-soft);
            font-size: 0.9rem;
            padding: 48px 20px;
            animation: fadeInUp 0.5s ease both;
        }
        .chat-empty-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }

        /* ═══════════════════════════════════════
           СТРОКИ СООБЩЕНИЙ
        ═══════════════════════════════════════ */
        .msg-row--search-hide { display: none !important; }
        .msg-row--search-hit .msg-bubble {
            box-shadow: 0 0 0 2px var(--accent), var(--shadow-bubble) !important;
        }

        .msg-row {
            display: flex;
            gap: 9px;
            align-items: flex-end;
            max-width: 100%;
            animation: msgIn 0.32s cubic-bezier(0.34,1.1,0.64,1) forwards;
            /* Группировка: небольшой отступ между разными авторами */
        }
        .msg-row + .msg-row { margin-top: 2px; }
        .msg-row--gap { margin-top: 10px !important; }

        .msg-row--me    { flex-direction: row-reverse; align-self: flex-end; }
        .msg-row--other { align-self: flex-start; }

        /* Аватарка */
        .msg-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 0.84rem;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,.28);
            box-shadow: 0 2px 8px rgba(0,0,0,.22);
            border: 2px solid rgba(255,255,255,.14);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .msg-row:hover .msg-avatar {
            transform: scale(1.06);
        }

        /* Скрываем аватарку для consecutive-сообщений того же пользователя */
        .msg-avatar--hidden {
            visibility: hidden;
        }

        .msg-stack {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: min(82%, 440px);
            min-width: 0;
        }
        .msg-row--me .msg-stack { align-items: flex-end; }

        /* Имя автора (только первое сообщение в группе) */
        .msg-author {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 3px;
            padding-left: 2px;
            letter-spacing: 0.01em;
        }
        .msg-row--me .msg-author { display: none; }

        /* ═══════════════════════════════════════
           БАБЛЫ СООБЩЕНИЙ
        ═══════════════════════════════════════ */
        .msg-bubble {
            padding: 10px 14px;
            font-size: 0.93rem;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: var(--shadow-bubble);
            transition:
                box-shadow 0.25s ease,
                transform 0.18s ease;
            position: relative;
            overflow: hidden;
        }

        /* Мои сообщения */
        .msg-bubble--me {
            background: var(--bubble-me-bg);
            color: var(--bubble-me-text);
            border-radius: var(--radius-bubble-me);
            border: 1px solid rgba(255,255,255,.1);
        }
        .msg-bubble--me.is-own { cursor: context-menu; }
        .msg-bubble--me.is-own:hover {
            transform: scale(1.01);
            box-shadow: 0 4px 20px var(--bubble-me-glow), var(--shadow-bubble);
        }
        .msg-bubble--me.is-own:active { transform: scale(0.99); }

        /* Чужие сообщения */
        .msg-bubble--other {
            background: var(--bubble-other-bg);
            color: var(--bubble-other-text);
            border-radius: var(--radius-bubble-other);
            border: 1px solid var(--bubble-other-border);
        }
        .msg-bubble--other:hover {
            transform: scale(1.005);
            box-shadow: 0 6px 20px rgba(0,0,0,.14);
        }

        /* Пульс при редактировании */
        .msg-bubble.is-editing-pulse {
            animation: editPulse 0.6s ease;
        }
        @keyframes editPulse {
            0%, 100% { box-shadow: var(--shadow-bubble); }
            50%       { box-shadow: 0 0 0 2.5px var(--accent), 0 6px 24px var(--bubble-me-glow); }
        }

        /* GIF внутри бабла */
        .msg-body .gif-inline {
            display: block;
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            margin-top: 8px;
        }

        /* Футер бабла (автор + время) */
        .msg-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px;
            margin-top: 6px;
            font-size: 0.64rem;
            opacity: 0.75;
        }
        .msg-bubble--me    .msg-footer { color: rgba(255,255,255,.8); }
        .msg-bubble--other .msg-footer { color: var(--muted); }
        .msg-edited {
            font-size: 0.6rem;
            opacity: 0.85;
            font-style: italic;
        }

        /* ═══════════════════════════════════════
           SCROLL-DOWN FAB
        ═══════════════════════════════════════ */
        .scroll-down-fab {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 25;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0,0,0,.25);
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
        }
        .scroll-down-fab:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(0,0,0,.32);
        }
        .scroll-down-fab .fab-badge {
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-text);
            font-size: 0.7rem;
            font-weight: 800;
            display: grid;
            place-items: center;
        }

        /* ═══════════════════════════════════════
           COMPOSER (поле ввода)
        ═══════════════════════════════════════ */
        .input-footer {
            flex-shrink: 0;
            padding:
                10px
                max(10px, env(safe-area-inset-right))
                max(14px, env(safe-area-inset-bottom))
                max(10px, env(safe-area-inset-left));
            background: var(--bg-base);
            border-top: 1px solid var(--border);
        }

        /* Баннер редактирования */
        .edit-banner {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            margin-bottom: 8px;
            border-radius: var(--radius-sm);
            background: var(--accent-dim);
            border: 1px solid rgba(94,200,255,.18);
            font-size: 0.82rem;
            color: var(--muted);
            animation: fadeInUp 0.25s ease;
        }
        .edit-banner.is-on { display: flex; }
        .edit-banner strong { color: var(--accent); font-weight: 600; }
        .edit-banner button {
            margin-left: auto;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px 6px;
            line-height: 1;
            border-radius: 6px;
            transition: color var(--transition), background var(--transition);
        }
        .edit-banner button:hover { color: var(--text); background: var(--surface-3); }

        /* Идентификация пользователя под composer */
        .footer-identity {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 8px;
            min-height: 28px;
        }
        .mini-avatar {
            width: 26px; height: 26px;
            border-radius: 50%;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 0.68rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,.2);
            box-shadow: 0 2px 6px rgba(0,0,0,.16);
            border: 2px solid rgba(255,255,255,.12);
        }
        .mini-name {
            font-size: 0.78rem;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--muted);
        }

        /* Сама оболочка composer */
        .compose-shell {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            padding: 8px 8px 8px 14px;
            border-radius: var(--radius-lg);
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-bubble);
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .compose-shell:focus-within {
            border-color: rgba(94,200,255,.28);
            box-shadow: 0 0 0 3px var(--accent-dim), var(--shadow-bubble);
        }
        [data-theme="light"] .compose-shell:focus-within {
            border-color: rgba(37,99,235,.28);
        }

        .emoji-wrap { position: relative; flex-shrink: 0; }

        .chat-input {
            flex: 1;
            min-width: 0;
            min-height: 44px;
            max-height: 130px;
            padding: 10px 4px;
            border: none;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 0.94rem;
            outline: none;
            resize: none;
            line-height: 1.45;
        }
        .chat-input::placeholder { color: var(--muted-soft); }

        /* Кнопка отправки — иконка-стрелочка */
        .btn-send {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            border: none;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent-strong), var(--accent));
            color: var(--accent-text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter var(--transition), opacity var(--transition),
                        transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow var(--transition);
            box-shadow: 0 4px 16px var(--bubble-me-glow);
        }
        .btn-send svg { width: 20px; height: 20px; }
        .btn-send:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }
        .btn-send:not(:disabled):hover {
            filter: brightness(1.1);
            transform: scale(1.08);
            box-shadow: 0 6px 20px var(--bubble-me-glow);
        }
        .btn-send:not(:disabled):active {
            animation: btnSendPop 0.3s ease;
        }
        /* В режиме сохранения (редактирование) */
        .btn-send.mode-save {
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 4px 16px rgba(16,185,129,.25);
        }
        [data-theme="light"] .btn-send {
            box-shadow: 0 4px 16px rgba(37,99,235,.2);
        }

        /* ═══════════════════════════════════════
           EMOJI POPOVER
        ═══════════════════════════════════════ */
        .emoji-popover {
            display: none;
            position: absolute;
            bottom: calc(100% + 12px);
            left: 0;
            width: min(360px, calc(100vw - 32px));
            max-height: 340px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 56px rgba(0,0,0,.4);
            z-index: 100;
            flex-direction: column;
            overflow: hidden;
            animation: sheetPop 0.22s cubic-bezier(0.34,1.2,0.64,1) forwards;
        }
        .emoji-popover.is-open { display: flex; }

        .emoji-tabs {
            display: flex;
            gap: 2px;
            padding: 8px 8px 0;
            overflow-x: auto;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .emoji-tabs::-webkit-scrollbar { display: none; }

        .emoji-tab {
            flex-shrink: 0;
            padding: 8px 12px;
            border: none;
            border-radius: 8px 8px 0 0;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: color var(--transition), background var(--transition);
            letter-spacing: 0.02em;
        }
        .emoji-tab:hover { color: var(--text); background: var(--surface-2); }
        .emoji-tab.is-active {
            color: var(--accent);
            background: var(--accent-dim);
        }

        .emoji-grid-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .emoji-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        .emoji-cell {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: transparent;
            font-size: 1.3rem;
            cursor: pointer;
            line-height: 1;
            transition: background var(--transition), transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .emoji-cell:hover {
            background: var(--accent-dim);
            transform: scale(1.12);
        }

        /* ═══════════════════════════════════════
           SHEET BACKDROP & CONTEXT MENU
        ═══════════════════════════════════════ */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            z-index: 298;
            background: rgba(0,0,0,.4);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .sheet-backdrop.is-on {
            opacity: 1;
            pointer-events: auto;
        }

        .ctx-menu {
            position: fixed;
            z-index: 300;
            min-width: 220px;
            max-width: min(92vw, 280px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 24px 64px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
            padding: 8px;
            display: none;
            transform-origin: top center;
            animation: sheetPop 0.2s cubic-bezier(0.34,1.2,0.64,1) forwards;
            backdrop-filter: blur(12px);
        }
        .ctx-menu.is-open { display: block; }

        .ctx-menu__btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            padding: 11px 14px;
            border: none;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: background var(--transition), transform 0.15s ease;
        }
        .ctx-menu__btn:hover {
            background: var(--accent-dim);
            transform: translateX(2px);
        }
        .ctx-menu__btn .ctx-ico {
            font-size: 1.1rem;
            width: 1.6em;
            text-align: center;
            flex-shrink: 0;
        }
        .ctx-menu__btn.danger { color: #f87171; }
        .ctx-menu__btn.danger:hover { background: rgba(248,113,113,.12); }

        /* Разделитель в ctx-menu */
        .ctx-menu__divider {
            height: 1px;
            background: var(--border);
            margin: 4px 8px;
        }

        /* ═══════════════════════════════════════
           TOAST
        ═══════════════════════════════════════ */
        .toast {
            position: fixed;
            bottom: max(28px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            z-index: 400;
            padding: 11px 22px;
            border-radius: 999px;
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.86rem;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0,0,0,.28);
            transition: transform 0.4s cubic-bezier(0.34,1.3,0.64,1);
            pointer-events: none;
            max-width: min(90vw, 360px);
            text-align: center;
        }
        .toast.is-visible { transform: translateX(-50%) translateY(0); }

        /* ═══════════════════════════════════════
           MODAL (настройки)
        ═══════════════════════════════════════ */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            place-items: center;
            padding: 20px;
        }
        .modal-backdrop.is-open { display: grid; }

        .modal {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: var(--shadow-card);
            animation: sheetPop 0.3s cubic-bezier(0.34,1.2,0.64,1);
        }
        .modal h3 {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 20px;
        }
        .modal .field label {
            display: block;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .modal .field input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .modal .field input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* ═══════════════════════════════════════
           АДАПТИВ
        ═══════════════════════════════════════ */
        @media (max-width: 480px) {
            .msg-stack { max-width: 88%; }
            .btn-logout span { display: none; }
            .auth-card { padding: 28px 22px; }
            .chat-messages { padding: 12px 10px 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .msg-row, .typing-dots span, .msg-bubble.is-editing-pulse,
            .ctx-menu, .auth-card, .emoji-popover { animation: none !important; }
            .chat-messages { scroll-behavior: auto; }
            .toast { transition: none; }
        }
    </style>
</head>
<body>

    <!-- ══════════════════════════════════════
         ЭКРАН АВТОРИЗАЦИИ
    ══════════════════════════════════════ -->
    <div class="auth-gate" id="authGate">
        <div class="auth-orb auth-orb--1" aria-hidden="true"></div>
        <div class="auth-orb auth-orb--2" aria-hidden="true"></div>
        <div class="auth-card">
            <div class="spinner-wrap" id="authChecking">
                <div class="spinner" aria-hidden="true"></div>
                <span>Проверка входа…</span>
            </div>
            <div class="hidden" id="authFormBlock">
                <div class="auth-logo">6<span>А</span></div>
                <h2 id="authTitle">Войти в чат</h2>
                <p class="sub" id="authSub">Вход по нику класса. Пароль — не короче 6 символов.</p>
                <div class="auth-field">
                    <label for="authNick">Твой ник</label>
                    <input type="text" id="authNick" class="auth-input auth-input-nick"
                           autocomplete="username" maxlength="32" required
                           placeholder="Например, Petya" spellcheck="false">
                </div>
                <div class="auth-field">
                    <label for="authPass">Пароль</label>
                    <input type="password" id="authPass" class="auth-input"
                           autocomplete="current-password" required minlength="6" placeholder="••••••••">
                </div>
                <div class="auth-error" id="authError" aria-live="polite"></div>
                <div class="auth-actions">
                    <button type="button" class="btn btn-primary" id="btnLogin">Войти</button>
                    <button type="button" class="btn btn-ghost" id="btnRegisterMode">Нет аккаунта? Регистрация</button>
                    <button type="button" class="btn btn-primary hidden" id="btnRegister">Создать аккаунт</button>
                    <button type="button" class="btn btn-ghost hidden" id="btnBackLogin">← Уже есть аккаунт</button>
                </div>
                <div class="spinner-wrap hidden" id="authSpinner">
                    <div class="spinner" aria-hidden="true"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════
         ОСНОВНОЙ ЧАТ
    ══════════════════════════════════════ -->
    <div class="hidden" id="appRoot">

        <!-- Хедер -->
        <header class="chat-top">
            <span class="chat-top-edge" aria-hidden="true"></span>
            <div class="chat-top-row">
