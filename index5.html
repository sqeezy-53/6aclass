    <!-- ══════════════════════════════════════
         FIREBASE + ЛОГИКА (не тронуто)
    ══════════════════════════════════════ -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            updateProfile
        } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
        import {
            getFirestore,
            collection,
            addDoc,
            onSnapshot,
            query,
            orderBy,
            serverTimestamp,
            doc,
            updateDoc,
            deleteDoc,
            setDoc,
            getDoc,
            deleteField
        } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyCtVaVgIvQot9SJpwKyUKrClNwar6xX9fo',
            authDomain: 'class6a-chat.firebaseapp.com',
            projectId: 'class6a-chat',
            storageBucket: 'class6a-chat.firebasestorage.app',
            messagingSenderId: '656933440681',
            appId: '1:656933440681:web:e7a8c2ae22181ec98f2db8'
        };

        /* ——— Константы ——— */
        const FAKE_EMAIL_DOMAIN = '@6a.ru';
        const THEME_KEY         = 'index6a_theme';
        const RECENT_EMOJI_KEY  = 'index6a_emoji_recent';
        const RECENT_MAX        = 24;
        const TYPING_MAX_MS     = 4500;
        const SCROLL_THRESHOLD  = 120;
        const SPAM_INTERVAL_MS  = 1500;

        /* ——— Фильтр мата ——— */
        function cleanContent(text) {
            let t = String(text);
            t = t.replace(/\b(?:f+u+c+k+|s+h+i+t+|d+a+m+n+)\b/gi, '❤');
            t = t.replace(
                /(хуй|хуя|хуе|хуи|хуё|хуищ|пизд|ебан|еба[тьл]|ебёт|ебать|ёб|бляд|блять|сука|муд[ао]|мудак|долбо|залуп|говноп|гандон)/gi,
                '❤'
            );
            return t;
        }

        /* ——— Эмодзи ——— */
        const EMOJI_GROUPS = [
            { id: 'recent', label: '🕐 Недавние', emojis: [] },
            { id: 'smileys', label: '😀 Смайлы', emojis: ['😀','😃','😄','😁','😅','😂','🤣','🥲','😊','😇','🙂','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','🤨','😐','😑','😶','😏','😒','🙄','😬','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕','🤢','🤮','🤧','🥵','🥶','🥴','😵','🤯','🤠','🥳','😎','🤓','🧐'] },
            { id: 'animals', label: '🐶 Животные', emojis: ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦆','🦅','🦉','🦇','🐺','🐗','🐴','🦄','🐝','🐛','🦋','🐌','🐞','🐜','🦟','🦗','🐢','🐍','🦎','🐙','🦑','🦐','🦀','🐡','🐠','🐟','🐬','🐳','🦈','🐊','🦒','🐘','🦛','🐪','🦓','🦍','🐕','🐈','🐇','🦝','🐁','🦔'] },
            { id: 'food', label: '🍕 Еда', emojis: ['🍏','🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍒','🍑','🍍','🥝','🍅','🥑','🥦','🥕','🌽','🥐','🥖','🧀','🥚','🍳','🥞','🥓','🥩','🍗','🌭','🍔','🍟','🍕','🥪','🌮','🌯','🍝','🍜','🍲','🍣','🍱','🥟','🍤','🍙','🍚','🍘','🧁','🍰','🎂','🍩','🍪','🍫','🍿','🥤','☕','🍵','🧋','🍺','🍷','🥂'] },
            { id: 'hearts', label: '❤️ Сердца', emojis: ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❤️‍🔥','❤️‍🩹','💕','💞','💓','💗','💖','💘','💝','💟','💋','💌','💐','🌹','🥀','🌷','🌸','🌻','🌼','🌺'] },
            { id: 'gestures', label: '👍 Жесты', emojis: ['👍','👎','👌','🤌','✌️','🤞','🤟','🤘','🤙','👋','🤚','🖐','✋','🖖','👏','🙌','🫶','👐','🤲','🤝','🙏','✍️','💅','💪','👀','👄','🫵','☝️','👆','👇','👈','👉'] },
            { id: 'objects', label: '💡 Вещи', emojis: ['📱','💻','⌨️','🖥','💾','📷','🎥','📞','📺','📻','🔋','💡','🔦','💸','💵','💳','🔨','🔧','⚙️','🧲','🔮','📿','🧬','🔭','🔬','🩺','💊','🧹','🛒','🎮','🕹','🎲','🎯','🃏','🎴'] },
            { id: 'sport', label: '⚽ Спорт', emojis: ['⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🏓','🏸','🏒','🥅','⛳','🎣','🥊','🥋','🛹','⛸','🎿','🏋️','🤸','⛹','🏊','🚴','🏆','🥇','🥈','🥉','🏅','🎖'] }
        ];

        /* ——— Утилиты ников ——— */
        function nickFromInput(raw) {
            let n = String(raw || '').trim();
            const low = n.toLowerCase();
            const suf = FAKE_EMAIL_DOMAIN.toLowerCase();
            if (low.endsWith(suf)) n = n.slice(0, n.length - FAKE_EMAIL_DOMAIN.length).trim();
            return n;
        }

        function nickToEmail(raw) {
            const n = nickFromInput(raw);
            if (!n) throw new Error('Введите ник');
            return n + FAKE_EMAIL_DOMAIN;
        }

        function displayNick(u) {
            if (!u) return '?';
            const dn = u.displayName && String(u.displayName).trim();
            if (dn) return dn;
            const em = u.email || '';
            const suf = FAKE_EMAIL_DOMAIN.toLowerCase();
            if (em.toLowerCase().endsWith(suf)) {
                return em.slice(0, em.length - FAKE_EMAIL_DOMAIN.length) || '?';
            }
            const at = em.indexOf('@');
            return at > 0 ? em.slice(0, at) : (em || '?');
        }

        /* ——— Firebase init ——— */
        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        const messagesCol   = collection(db, 'messages');
        const messagesQuery = query(messagesCol, orderBy('createdAt', 'asc'));
        const typingRef     = doc(db, 'presence', 'typing');

        /* ——— DOM refs ——— */
        const authGate        = document.getElementById('authGate');
        const appRoot         = document.getElementById('appRoot');
        const authChecking    = document.getElementById('authChecking');
        const authFormBlock   = document.getElementById('authFormBlock');
        const authSpinner     = document.getElementById('authSpinner');
        const authError       = document.getElementById('authError');
        const authSub         = document.getElementById('authSub');
        const btnRegisterMode = document.getElementById('btnRegisterMode');
        const btnBackLogin    = document.getElementById('btnBackLogin');
        const btnLogin        = document.getElementById('btnLogin');
        const btnRegister     = document.getElementById('btnRegister');
        const authNick        = document.getElementById('authNick');
        const authPass        = document.getElementById('authPass');

        const chatMessages    = document.getElementById('chatMessages');
        const chatEmpty       = document.getElementById('chatEmpty');
        const chatInput       = document.getElementById('chatInput');
        const chatSend        = document.getElementById('chatSend');
        const globalStatus    = document.getElementById('globalStatus');
        const typingBar       = document.getElementById('typingBar');
        const scrollDownFab   = document.getElementById('scrollDownFab');
        const scrollDownBadge = document.getElementById('scrollDownBadge');
        const footerAvatar    = document.getElementById('footerAvatar');
        const footerName      = document.getElementById('footerName');
        const emojiPopover    = document.getElementById('emojiPopover');
        const emojiTabs       = document.getElementById('emojiTabs');
        const emojiGrid       = document.getElementById('emojiGrid');
        const btnEmoji        = document.getElementById('btnEmoji');
        const ctxMenu         = document.getElementById('ctxMenu');
        const sheetBackdrop   = document.getElementById('sheetBackdrop');
        const toastEl         = document.getElementById('toast');
        const msgSearchInput  = document.getElementById('msgSearchInput');
        const searchHint      = document.getElementById('searchHint');
        const editBanner      = document.getElementById('editBanner');
        const editBannerCancel = document.getElementById('editBannerCancel');
        const settingsBackdrop = document.getElementById('settingsBackdrop');
        const settingsName    = document.getElementById('settingsName');
        const settingsSave    = document.getElementById('settingsSave');
        const settingsCancel  = document.getElementById('settingsCancel');

        /* ——— Состояние ——— */
        let stickToBottom         = true;
        let messagesUnsub         = null;
        let typingUnsub           = null;
        let typingInterval        = null;
        let typingWriteTimer      = null;
        let lastTypingWrite       = 0;
        let lastKnownLastMessageId = null;
        let unreadBelow           = 0;
        let editingMessageId      = null;
        let emojiActiveTab        = 'recent';
        let lastOutboundAt        = 0;
        let toastTimer            = null;
        let searchDebounceTimer   = null;

        function getMyUid() {
            const u = auth.currentUser;
            return u ? String(u.uid) : '';
        }

        function isNearBottom(el) {
            return el.scrollHeight - el.scrollTop - el.clientHeight < SCROLL_THRESHOLD;
        }

        /* ——— Тема ——— */
        function setTheme(mode) {
            const next = mode === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem(THEME_KEY, next);
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme') || 'dark';
            setTheme(cur === 'dark' ? 'light' : 'dark');
        });

        /* ——— Auth UI ——— */
        function showAuthError(msg) { authError.textContent = msg || ''; }

        function setAuthLoading(on) {
            authSpinner.classList.toggle('hidden', !on);
            btnLogin.disabled = on;
            btnRegister.disabled = on;
            authNick.disabled = on;
            authPass.disabled = on;
        }

        function registerMode(on) {
            btnRegister.classList.toggle('hidden', !on);
            btnBackLogin.classList.toggle('hidden', !on);
            btnRegisterMode.classList.toggle('hidden', on);
            btnLogin.classList.toggle('hidden', on);
            authSub.textContent = on
                ? 'Придумай ник и пароль (от 6 символов).'
                : 'Вход по нику класса. Пароль — не короче 6 символов.';
            showAuthError('');
        }

        btnRegisterMode.addEventListener('click', () => registerMode(true));
        btnBackLogin.addEventListener('click',    () => registerMode(false));

        btnLogin.addEventListener('click', async () => {
            showAuthError('');
            setAuthLoading(true);
            try {
                await signInWithEmailAndPassword(auth, nickToEmail(authNick.value), authPass.value);
            } catch (e) {
                showAuthError(e.message || String(e));
            } finally {
                setAuthLoading(false);
            }
        });

        btnRegister.addEventListener('click', async () => {
            showAuthError('');
            setAuthLoading(true);
            try {
                const nick = nickFromInput(authNick.value);
                if (!nick) { showAuthError('Введите ник'); return; }
                const cred = await createUserWithEmailAndPassword(auth, nickToEmail(authNick.value), authPass.value);
                await updateProfile(cred.user, { displayName: nick });
                // Сохраняем displayName в Firestore сразу при регистрации (нужно для ликвидации)
                try {
                    await setDoc(doc(db, 'users', cred.user.uid), {
                        displayName: nick,
                        uid: cred.user.uid,
                        email: cred.user.email || '',
                        stars: 0
                    }, { merge: true });
                } catch(_) {}
            } catch (e) {
                showAuthError(e.message || String(e));
            } finally {
                setAuthLoading(false);
            }
        });

        // Enter в полях авторизации
        [authNick, authPass].forEach(inp => {
            inp.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!btnLogin.classList.contains('hidden') && !btnLogin.disabled) btnLogin.click();
                    else if (!btnRegister.classList.contains('hidden') && !btnRegister.disabled) btnRegister.click();
                }
            });
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        document.getElementById('btnSettings').addEventListener('click', () => {
            const u = auth.currentUser;
            if (!u) return;
            settingsName.value = u.displayName || '';
            settingsBackdrop.classList.add('is-open');
        });

        settingsCancel.addEventListener('click', () => settingsBackdrop.classList.remove('is-open'));
        settingsBackdrop.addEventListener('click', (e) => {
            if (e.target === settingsBackdrop) settingsBackdrop.classList.remove('is-open');
        });

        settingsSave.addEventListener('click', async () => {
            const u = auth.currentUser;
            if (!u) return;
            try {
                await updateProfile(u, { displayName: settingsName.value.trim() || displayNick(u) });
                renderFooterIdentity();
                settingsBackdrop.classList.remove('is-open');
                showToast('Ник обновлён ✓');
            } catch (e) {
                globalStatus.textContent = e.message || String(e);
                globalStatus.classList.add('is-error');
            }
        });

        /* ——— Аватарки ——— */
        function avatarGradient(uid) {
            let h = 0;
            const s = String(uid || 'x');
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            const h1 = h % 360;
            const h2 = (h1 + 38 + (h % 40)) % 360;
            return `linear-gradient(135deg, hsl(${h1} 65% 48%) 0%, hsl(${h2} 58% 42%) 100%)`;
        }

        function firstLetter(displayName, fallback) {
            const t = (displayName && String(displayName).trim()) || fallback || '?';
            const ch = [...t][0] || '?';
            return ch.toUpperCase();
        }

        function renderAvatarCircle(el, uid, displayName, fallbackLabel) {
            el.innerHTML = '';
            el.style.background = avatarGradient(uid);
            el.textContent = firstLetter(displayName, fallbackLabel);
        }

        function renderFooterIdentity() {
            const u = auth.currentUser;
            if (!u) return;
            const name = displayNick(u);
            renderAvatarCircle(footerAvatar, u.uid, u.displayName, name);
            footerName.textContent = name;
        }

        /* ——— Emoji picker ——— */
        function loadRecentEmojis() {
            try {
                const raw = localStorage.getItem(RECENT_EMOJI_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (_) { return []; }
        }

        function saveRecentEmoji(ch) {
            let list = loadRecentEmojis().filter((x) => x !== ch);
            list.unshift(ch);
            list = list.slice(0, RECENT_MAX);
            try { localStorage.setItem(RECENT_EMOJI_KEY, JSON.stringify(list)); } catch (_) { /* ignore */ }
        }

        function insertEmoji(ch) {
            saveRecentEmoji(ch);
            chatInput.value += ch;
            chatInput.dispatchEvent(new Event('input'));
            chatInput.focus();
        }

        function buildEmojiPicker() {
            emojiTabs.innerHTML = '';
            EMOJI_GROUPS.forEach((g) => {
                const t = document.createElement('button');
                t.type = 'button';
                t.className = 'emoji-tab' + (g.id === emojiActiveTab ? ' is-active' : '');
                t.textContent = g.label;
                t.dataset.tab = g.id;
                t.addEventListener('click', () => { emojiActiveTab = g.id; buildEmojiPicker(); });
                emojiTabs.appendChild(t);
            });

            emojiGrid.innerHTML = '';
            const group = EMOJI_GROUPS.find((x) => x.id === emojiActiveTab) || EMOJI_GROUPS[1];
            let list = group.id === 'recent' ? loadRecentEmojis() : group.emojis;
            if (group.id === 'recent' && list.length === 0) {
                const hint = document.createElement('div');
                hint.style.cssText = 'color:var(--muted);font-size:0.82rem;padding:16px;text-align:center;width:100%';
                hint.textContent = 'Выберите эмодзи — они появятся здесь 👆';
                emojiGrid.appendChild(hint);
                return;
            }
            list.forEach((em) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'emoji-cell';
                b.textContent = em;
                b.addEventListener('click', () => {
                    insertEmoji(em);
                    if (emojiActiveTab === 'recent') buildEmojiPicker();
                });
                emojiGrid.appendChild(b);
            });
        }

        buildEmojiPicker();

        btnEmoji.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = emojiPopover.classList.toggle('is-open');
            if (open) { emojiActiveTab = 'recent'; buildEmojiPicker(); }
        });

        emojiPopover.addEventListener('click', (e) => e.stopPropagation());
        ctxMenu.addEventListener('click',      (e) => e.stopPropagation());
        sheetBackdrop.addEventListener('click', () => closeCtxMenu());

        document.addEventListener('click', () => {
            emojiPopover.classList.remove('is-open');
            closeCtxMenu();
        });

        /* ——— Toast ——— */
        function showToast(msg, ms = 2400) {
            toastEl.textContent = msg;
            toastEl.classList.add('is-visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), ms);
        }

        /* ——— Копирование ——— */
        async function copyMessageText(plain) {
            const t = String(plain || '');
            try {
                await navigator.clipboard.writeText(t);
                showToast('📋 Скопировано');
            } catch (_) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = t;
                    ta.style.cssText = 'position:fixed;left:-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('📋 Скопировано');
                } catch (e2) { showToast('Не удалось скопировать'); }
            }
        }

        /* ——— Поиск ——— */
        function applyMessageSearch() {
            const q = (msgSearchInput && msgSearchInput.value.trim().toLowerCase()) || '';
            const rows = chatMessages.querySelectorAll('.msg-row');
            let hits = 0;
            rows.forEach((row) => {
                const plain = (row.dataset.plain || '').toLowerCase();
                if (!q) {
                    row.classList.remove('msg-row--search-hide', 'msg-row--search-hit');
                    return;
                }
                if (plain.includes(q)) {
                    row.classList.remove('msg-row--search-hide');
                    row.classList.add('msg-row--search-hit');
                    hits++;
                } else {
                    row.classList.add('msg-row--search-hide');
                    row.classList.remove('msg-row--search-hit');
                }
            });
            if (searchHint) searchHint.textContent = q ? `Совпадений: ${hits}` : '';
        }

        if (msgSearchInput) {
            msgSearchInput.addEventListener('input', () => {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(applyMessageSearch, 200);
            });
        }

        /* ——— HTML escape ——— */
        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        const GIF_URL = /(https?:\/\/[^\s<]+\.gif)(\b|[?#][^\s<]*)?/gi;

        function renderMessageBody(raw) {
            const wrap = document.createElement('div');
            wrap.className = 'msg-body';
            if (!raw) return wrap;
            let last = 0, m;
            GIF_URL.lastIndex = 0;
            while ((m = GIF_URL.exec(raw)) !== null) {
                const before = raw.slice(last, m.index);
                if (before) appendPlainText(wrap, before);
                const img = document.createElement('img');
                img.className = 'gif-inline';
                img.src = m[1];
                img.alt = '';
                img.loading = 'lazy';
                img.referrerPolicy = 'no-referrer';
                wrap.appendChild(img);
                last = m.index + m[0].length;
            }
            const rest = raw.slice(last);
            if (rest) appendPlainText(wrap, rest);
            return wrap;
        }

        function appendPlainText(container, text) {
            const div = document.createElement('div');
            div.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
            while (div.firstChild) container.appendChild(div.firstChild);
        }

        function formatTime(ts) {
            if (!ts || typeof ts.toDate !== 'function') return '';
            return ts.toDate().toLocaleString('ru-RU', {
                day: 'numeric', month: 'short',
                hour: '2-digit', minute: '2-digit'
            });
        }

        /* ——— Context menu ——— */
        function closeCtxMenu() {
            ctxMenu.classList.remove('is-open');
            ctxMenu.setAttribute('aria-hidden', 'true');
            sheetBackdrop.classList.remove('is-on');
        }

        function openCtxMenu(x, y, items) {
            ctxMenu.innerHTML = '';
            items.forEach(({ label, danger, icon, onClick }, i) => {
                if (label === '---') {
                    const d = document.createElement('div');
                    d.className = 'ctx-menu__divider';
                    ctxMenu.appendChild(d);
                    return;
                }
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'ctx-menu__btn' + (danger ? ' danger' : '');
                const ico = document.createElement('span');
                ico.className = 'ctx-ico';
                ico.setAttribute('aria-hidden', 'true');
                ico.textContent = icon || '•';
                b.appendChild(ico);
                const span = document.createElement('span');
                span.textContent = label;
                b.appendChild(span);
                b.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    onClick();
                    closeCtxMenu();
                });
                ctxMenu.appendChild(b);
            });
            ctxMenu.classList.add('is-open');
            ctxMenu.setAttribute('aria-hidden', 'false');
            sheetBackdrop.classList.add('is-on');
            const pad = 10;
            let left = x, top = y;
            ctxMenu.style.left = '0';
            ctxMenu.style.top = '0';
            const rect = ctxMenu.getBoundingClientRect();
            if (left + rect.width  > innerWidth  - pad) left = innerWidth  - rect.width  - pad;
            if (top  + rect.height > innerHeight - pad) top  = innerHeight - rect.height - pad;
            ctxMenu.style.left = `${Math.max(pad, left)}px`;
            ctxMenu.style.top  = `${Math.max(pad, top)}px`;
        }

        /* ——— Edit message ——— */
        function startEditMessage(msgId, text) {
            editingMessageId = msgId;
            chatInput.value = text || '';
            editBanner.classList.add('is-on');
            chatSend.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><polyline points="20 6 9 17 4 12"/></svg>';
            chatSend.classList.add('mode-save');
            chatSend.disabled = !String(chatInput.value).trim();
            chatInput.focus();
        }

        function cancelEditMessage() {
            editingMessageId = null;
            chatInput.value = '';
            editBanner.classList.remove('is-on');
            chatSend.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>';
            chatSend.classList.remove('mode-save');
            chatSend.disabled = true;
        }

        editBannerCancel.addEventListener('click', cancelEditMessage);

        function showMessageContextMenu(clientX, clientY, msgId, data) {
            const cur = auth.currentUser;
            if (!cur || String(data.uid || '') !== String(cur.uid)) return;
            const plain = data.text || '';
            openCtxMenu(clientX, clientY, [
                { label: 'Изменить', icon: '✏️', onClick: () => startEditMessage(msgId, plain) },
                { label: 'Копировать', icon: '📋', onClick: () => copyMessageText(plain) },
                { label: '---' },
                {
                    label: 'Удалить', icon: '🗑️', danger: true,
                    onClick: async () => {
                        if (!confirm('Удалить сообщение?')) return;
                        try {
                            await deleteDoc(doc(db, 'messages', msgId));
                        } catch (e) {
                            globalStatus.textContent = e.message || String(e);
                            globalStatus.classList.add('is-error');
                        }
                    }
                }
            ]);
        }

        /* ——— Scroll FAB ——— */
        function updateScrollFab() {
            if (unreadBelow > 0) {
                scrollDownFab.classList.remove('hidden');
                scrollDownBadge.textContent = unreadBelow > 99 ? '99+' : String(unreadBelow);
                scrollDownBadge.classList.remove('hidden');
            } else if (!isNearBottom(chatMessages)) {
                scrollDownFab.classList.remove('hidden');
                scrollDownBadge.classList.add('hidden');
            } else {
                scrollDownFab.classList.add('hidden');
                scrollDownBadge.classList.add('hidden');
            }
        }

        scrollDownFab.addEventListener('click', () => {
            unreadBelow = 0;
            stickToBottom = true;
            chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
            updateScrollFab();
        });

        /* ——— Render message row ——— */
        function renderMessageRow(docSnap, prevDocSnap) {
            const id    = docSnap.id;
            const d     = docSnap.data();
            const myUid = getMyUid();
            const isMe  = String(d.uid || '') === myUid && myUid !== '';

            // Определяем, нужен ли отступ (смена автора)
            const prevUid = prevDocSnap ? (prevDocSnap.data().uid || '') : null;
            const sameAuthor = prevUid && String(prevUid) === String(d.uid || '');

            const row = document.createElement('div');
            row.className = 'msg-row ' + (isMe ? 'msg-row--me' : 'msg-row--other');
            if (!sameAuthor && prevDocSnap) row.classList.add('msg-row--gap');
            row.dataset.msgId  = id;
            row.dataset.plain  = d.text || '';

            const av = document.createElement('div');
            av.className = 'msg-avatar' + (sameAuthor ? ' msg-avatar--hidden' : '');
            const uidKey = d.uid || id;
            const authorLabel = d.author || 'Гость';
            renderAvatarCircle(av, uidKey, authorLabel, authorLabel);

            const stack = document.createElement('div');
            stack.className = 'msg-stack';

            // Показываем имя автора только для первого в группе (чужие)
            if (!isMe && !sameAuthor) {
                const authorEl = document.createElement('div');
                authorEl.className = 'msg-author';
                authorEl.textContent = authorLabel;
                stack.appendChild(authorEl);
            }

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble ' + (isMe ? 'msg-bubble--me' : 'msg-bubble--other');
            if (isMe) bubble.classList.add('is-own');

            bubble.appendChild(renderMessageBody(d.text || ''));

            const foot = document.createElement('div');
            foot.className = 'msg-footer';
            const authorSpan = document.createElement('span');
            authorSpan.textContent = isMe ? 'Вы' : authorLabel;
            const timeSpan = document.createElement('span');
            timeSpan.textContent = formatTime(d.createdAt);
            foot.appendChild(authorSpan);
            foot.appendChild(timeSpan);
            if (d.edited) {
                const ed = document.createElement('span');
                ed.className = 'msg-edited';
                ed.textContent = '(изм.)';
                foot.appendChild(ed);
            }
            bubble.appendChild(foot);
            stack.appendChild(bubble);
            row.appendChild(av);
            row.appendChild(stack);

            if (isMe) {
                bubble.addEventListener('click', (e) => {
                    if (e.target.closest('img.gif-inline')) return;
                    e.stopPropagation();
                    e.preventDefault();
                    showMessageContextMenu(e.clientX, e.clientY, id, d);
                });
                bubble.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (e.target.closest('img.gif-inline')) return;
                    showMessageContextMenu(e.clientX, e.clientY, id, d);
                });
            }

            return row;
        }

        /* ——— Update DOM ——— */
        function updateMessagesDOM(snapshot) {
            const atBottom = isNearBottom(chatMessages);
            const prevScrollTop    = chatMessages.scrollTop;
            const prevScrollHeight = chatMessages.scrollHeight;

            const newLastId = snapshot.empty ? null : snapshot.docs[snapshot.docs.length - 1].id;
            if (lastKnownLastMessageId !== null && newLastId !== null
                && newLastId !== lastKnownLastMessageId && !atBottom && !stickToBottom) {
                unreadBelow++;
            }
            if (atBottom || stickToBottom) unreadBelow = 0;
            lastKnownLastMessageId = newLastId;

            chatMessages.querySelectorAll('.msg-row').forEach((n) => n.remove());

            if (snapshot.empty) {
                chatEmpty.style.display = '';
            } else {
                chatEmpty.style.display = 'none';
                const docs = snapshot.docs;
                docs.forEach((docSnap, i) => {
                    chatMessages.appendChild(renderMessageRow(docSnap, docs[i - 1] || null));
                });
            }

            const shouldStick = atBottom || stickToBottom;
            requestAnimationFrame(() => {
                if (shouldStick) {
                    chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
                } else {
                    chatMessages.scrollTop = prevScrollTop + (chatMessages.scrollHeight - prevScrollHeight);
                }
                updateScrollFab();
                applyMessageSearch();
            });
        }

        /* ——— Scroll listener ——— */
        chatMessages.addEventListener('scroll', () => {
            const near = isNearBottom(chatMessages);
            stickToBottom = near;
            if (near) unreadBelow = 0;
            updateScrollFab();
        });

        /* ——— Typing ——— */
        chatInput.addEventListener('input', () => {
            const t = chatInput.value.trim();
            chatSend.disabled = !t;
            scheduleTypingPing();
        });

        function scheduleTypingPing() {
            const u = auth.currentUser;
            if (!u || !chatInput.value.trim()) return;
            const now = Date.now();
            if (now - lastTypingWrite < 900) {
                clearTimeout(typingWriteTimer);
                typingWriteTimer = setTimeout(() => writeTypingPing(), 400);
                return;
            }
            writeTypingPing();
        }

        async function writeTypingPing() {
            const u = auth.currentUser;
            if (!u || !chatInput.value.trim()) return;
            lastTypingWrite = Date.now();
            try {
                await setDoc(
                    typingRef,
                    { users: { [u.uid]: { t: serverTimestamp(), n: displayNick(u) } } },
                    { merge: true }
                );
            } catch (_) { /* ignore */ }
        }

        chatInput.addEventListener('blur', async () => {
            const u = auth.currentUser;
            if (!u) return;
            try {
                await setDoc(typingRef, { users: { [u.uid]: deleteField() } }, { merge: true });
            } catch (_) { /* ignore */ }
        });

        function renderTypingFromData(data) {
            const u = auth.currentUser;
            if (!u) { typingBar.innerHTML = ''; return; }
            const users = (data && data.users) || {};
            const names = [];
            const now = Date.now();
            Object.entries(users).forEach(([uid, v]) => {
                if (String(uid) === String(u.uid) || !v || !v.t) return;
                let ts = 0;
                try { ts = typeof v.t.toMillis === 'function' ? v.t.toMillis() : 0; } catch (_) { return; }
                if (now - ts < TYPING_MAX_MS) names.push(v.n || 'Кто-то');
            });
            if (!names.length) { typingBar.innerHTML = ''; return; }
            typingBar.innerHTML =
                '<span>' + names.join(', ') + ' печатает</span>' +
                '<span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>';
        }

        async function tickTyping() {
            try {
                const s = await getDoc(typingRef);
                renderTypingFromData(s.data());
            } catch (_) { /* ignore */ }
        }

        function startTypingListeners() {
            if (typingUnsub) typingUnsub();
            typingUnsub = onSnapshot(typingRef, (snap) => renderTypingFromData(snap.data()), () => {});
            if (typingInterval) clearInterval(typingInterval);
            typingInterval = setInterval(tickTyping, 700);
        }

        /* ——— Submit ——— */
        async function submitComposer() {
            const u = auth.currentUser;
            if (!u) return;
            let text = cleanContent(chatInput.value).trim();
            if (!text) {
                globalStatus.textContent = 'Введите текст сообщения';
                globalStatus.classList.add('is-error');
                return;
            }
            if (!editingMessageId) {
                const now = Date.now();
                if (now - lastOutboundAt < SPAM_INTERVAL_MS) {
                    showToast('⏳ Не спамь!');
                    return;
                }
            }
            chatSend.disabled = true;
            stickToBottom = true;
            globalStatus.textContent = '';
            globalStatus.classList.remove('is-error');
            try {
                if (editingMessageId) {
                    await updateDoc(doc(db, 'messages', editingMessageId), { text, edited: true });
                    cancelEditMessage();
                } else {
                    await addDoc(messagesCol, {
                        uid: u.uid,
                        author: displayNick(u),
                        text,
                        createdAt: serverTimestamp(),
                        edited: false
                    });
                    lastOutboundAt = Date.now();
                    chatInput.value = '';
                }
            } catch (e) {
                globalStatus.textContent = e.message || String(e);
                globalStatus.classList.add('is-error');
            } finally {
                chatSend.disabled = !chatInput.value.trim();
            }
        }

        chatSend.addEventListener('click', submitComposer);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!chatSend.disabled) submitComposer();
            }
        });

        /* ——— Teardown / Startup ——— */
        function tearDownChat() {
            if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }
            if (typingUnsub)   { typingUnsub();   typingUnsub   = null; }
            if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
            chatMessages.querySelectorAll('.msg-row').forEach((n) => n.remove());
            chatEmpty.style.display = '';
            typingBar.innerHTML = '';
            lastKnownLastMessageId = null;
            unreadBelow = 0;
            cancelEditMessage();
            scrollDownFab.classList.add('hidden');
            if (msgSearchInput) msgSearchInput.value = '';
            if (searchHint) searchHint.textContent = '';
        }

        function startChatForUser() {
            tearDownChat();
            globalStatus.textContent = '';
            globalStatus.classList.remove('is-error');
            renderFooterIdentity();
            messagesUnsub = onSnapshot(
                messagesQuery,
                (snapshot) => {
                    globalStatus.textContent = '';
                    globalStatus.classList.remove('is-error');
                    updateMessagesDOM(snapshot);
                },
                () => {
                    globalStatus.textContent = 'Не удалось загрузить чат. Проверьте правила Firestore.';
                    globalStatus.classList.add('is-error');
                }
            );
            startTypingListeners();
        }

        let _banUnsubscribe5 = null;

        function showBanned5() {
            if (_banUnsubscribe5) { _banUnsubscribe5(); _banUnsubscribe5 = null; }
            signOut(auth).catch(() => {});
            showAuthError('🚫 Аккаунт ликвидирован. Доступ ограничен.');
            authFormBlock.classList.remove('hidden');
            authGate.classList.remove('hidden');
            appRoot.classList.add('hidden');
            authPass.value = '';
            tearDownChat();
        }

        onAuthStateChanged(auth, async (user) => {
            authChecking.classList.add('hidden');
            if (_banUnsubscribe5) { _banUnsubscribe5(); _banUnsubscribe5 = null; }
            if (!user) {
                authFormBlock.classList.remove('hidden');
                authGate.classList.remove('hidden');
                appRoot.classList.add('hidden');
                authPass.value = '';
                tearDownChat();
                return;
            }
            // ── ПРОВЕРКА БАНА при входе ────────────────────────────
            try {
                const userSnap = await getDoc(doc(db, 'users', user.uid));
                if (userSnap.exists() && userSnap.data().banned === true) {
                    showBanned5(); return;
                }
            } catch (e) { console.warn('ban check error:', e); }
            // ── REALTIME: мгновенно реагируем на ликвидацию ───────
            _banUnsubscribe5 = onSnapshot(doc(db, 'users', user.uid), snap => {
                if (snap.exists() && snap.data().banned === true) showBanned5();
            });
            // ───────────────────────────────────────────────────────
            // Гарантируем что displayName сохранён в Firestore (важно для ликвидации)
            try {
                const u = auth.currentUser;
                if (u) {
                    await setDoc(doc(db, 'users', u.uid), {
                        displayName: displayNick(u),
                        uid: u.uid,
                        email: u.email || ''
                    }, { merge: true });
                }
            } catch(_) {}
            authFormBlock.classList.add('hidden');
            authGate.classList.add('hidden');
            appRoot.classList.remove('hidden');
            startChatForUser();
        });

        /*
         * Firestore Security Rules (не менять):
         * rules_version = '2';
         * service cloud.firestore {
         *   match /databases/{database}/documents {
         *     match /messages/{msgId} {
         *       allow read: if request.auth != null;
         *       allow create: if request.auth != null
         *         && request.resource.data.uid == request.auth.uid
         *         && request.resource.data.author is string
         *         && request.resource.data.text is string
         *         && request.resource.data.text.size() > 0
         *         && request.resource.data.text.size() <= 4000;
         *       allow update: if request.auth != null
         *         && resource.data.uid == request.auth.uid
         *         && request.resource.data.uid == resource.data.uid;
         *       allow delete: if request.auth != null
         *         && resource.data.uid == request.auth.uid;
         *     }
         *     match /presence/{docId} {
         *       allow read, write: if request.auth != null;
         *     }
         *   }
         * }
         */

    </script>
</body>
