<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чат 6А · восстановление</title>
<style>
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050505;color:#fff}
  body{display:grid;place-items:center}
  .card{width:min(360px,calc(100vw - 32px));padding:22px;border-radius:22px;background:#111;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 70px rgba(0,0,0,.45);text-align:center}
  .spin{width:28px;height:28px;margin:0 auto 12px;border:3px solid rgba(255,255,255,.18);border-top-color:#60a5fa;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  .muted{color:#aaa;font-size:.9rem;line-height:1.45}
</style>
</head>
<body>
<div class="card" id="restoreCard"><div class="spin"></div><b>Восстановление чата…</b><div class="muted">Загружаю рабочую полную страницу.</div></div>
<script>
(async function(){
  var stableIndex = 'https://raw.githubusercontent.com/sqeezy-53/6aclass/7b76e25f9dc6529e327edc81ccb9bfadff5f3ca9/index5.html';
  try {
    var resp = await fetch(stableIndex, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var html = await resp.text();
    html = html.replace(
      '<script src="assets/js/chat/e2e-security-refactor.js"><\/script>',
      '<script src="assets/js/chat/e2e-security-refactor.js"><\/script>\n<script src="assets/js/chat/e2e-media-compat.js"><\/script>'
    );
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    console.error('[index5 restore loader]', e);
    document.getElementById('restoreCard').innerHTML = '<b>Не удалось восстановить страницу</b><div class="muted">Нажми Ctrl+Shift+R. Если не помогло — очисти кэш сайта.</div>';
  }
})();
</script>
</body>
</html>
